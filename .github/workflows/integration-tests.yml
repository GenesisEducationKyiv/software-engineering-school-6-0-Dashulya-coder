name: Integration Tests

on:
  push:
  pull_request:

jobs:
  integration:
    name: Run integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notifier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/notifier_test?sslmode=disable"
          INTEGRATION: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test ./tests/integration/... -v -count=1 -timeout=120s
