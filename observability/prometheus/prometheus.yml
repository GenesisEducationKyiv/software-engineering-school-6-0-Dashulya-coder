global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: casetasknotifier
    static_configs:
      - targets: ["app:8080"]

  - job_name: notifier
    static_configs:
      - targets: ["notifier:9092"]
