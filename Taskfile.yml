version: '3'
includes:
  ops:
    taskfile: .ops/Taskfile.yml
    optional: true

tasks:
  proto:gen:
    desc: Generate Go code from proto definitions
    dir: notifier
    cmds:
      - buf dep update
      - buf generate

  ops:setup:
    desc: Sync ops config
    cmds:
      - |
        if [ -d .ops ]; then
          git -C .ops pull
        else
          git clone --branch {{.OPS_BRANCH}} https://github.com/vladyslavpavlenko/ses-6-ops.git .ops
        fi
      - mkdir -p .github/workflows
      - cp .ops/workflows/*.yml .github/workflows/
    vars:
      OPS_BRANCH: '{{.OPS_BRANCH | default "main"}}'

  test:integration:
    desc: Run integration tests
    cmds:
      - docker compose -f tests/integration/docker-compose.test.yml up -d --wait
      - defer: docker compose -f tests/integration/docker-compose.test.yml down -v
      - DATABASE_URL="postgres://postgres:postgres@localhost:5433/notifier_test?sslmode=disable"
        INTEGRATION=1
        go test ./tests/integration/... -v -count=1 -timeout=120s

  test:e2e:
    desc: Run E2E tests
    cmds:
      - docker compose -f tests/e2e/docker-compose.e2e.yml up -d --build --wait
      - defer: docker compose -f tests/e2e/docker-compose.e2e.yml down -v
      - E2E_BASE_URL=http://localhost:8081 npx playwright test